name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is what a base-branch retarget sends: without it a stacked PR
    # moved onto main keeps whatever check result it had before.
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check:version

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

  e2e-prod:
    # The static export is the deployed artifact; render it and drive the
    # filter-persistence journey against it. Not a substitute for the
    # authenticated, identity-isolation or sync acceptance runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e:prod
